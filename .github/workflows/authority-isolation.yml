name: Authority process isolation diagnostic

on:
  pull_request:
    paths:
      - 'proofgate_authority/**'
      - 'framework/**'
      - 'examples/entitlement/**'
      - 'scripts/check_authority_isolation.py'
      - '.github/workflows/authority-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare packaged sandbox on disposable hosted runner
        run: |
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "${GITHUB_ACTIONS:-}" = true
          umask 077
          mkdir "$RUNNER_TEMP/cli-setup"
          sudo apt-get update -qq
          sudo env NEEDRESTART_MODE=l apt-get install --yes --no-install-recommends bubblewrap apparmor-profiles
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          cp "$profile" "$RUNNER_TEMP/cli-setup/bwrap-userns-restrict"
          dpkg-query --show --showformat='${Package} ${Version}\n' bubblewrap apparmor-profiles > "$RUNNER_TEMP/cli-setup/packages.txt"
          echo "11d39094f044f0cda0febb3ad517b830301da6b2ce929664af09ee9e4dd264f9  $profile" | sha256sum --check --status
          for local in /etc/apparmor.d/local/bwrap-userns-restrict /etc/apparmor.d/local/unpriv_bwrap; do
            if test -f "$local" && grep -Eqv '^[[:space:]]*(#.*)?$' "$local"; then
              echo "Custom AppArmor override requires review"
              exit 2
            fi
          done
          sudo /usr/sbin/apparmor_parser -r "$profile"
          cli_uid=$(id -u)
          test "$cli_uid" -ne 0
          sudo systemctl start "user@$cli_uid.service"
          echo "XDG_RUNTIME_DIR=/run/user/$cli_uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$cli_uid/bus" >> "$GITHUB_ENV"
      - name: Run fixed process diagnostic without App or owner credentials
        run: /usr/bin/python3 -I -B scripts/check_authority_isolation.py "$RUNNER_TEMP/process-isolation.json"
      - name: Retain complete or incomplete diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: authority-process-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cli-setup/
            ${{ runner.temp }}/process-isolation.json
          retention-days: 7
          if-no-files-found: warn
