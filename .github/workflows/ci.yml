name: Offline release checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      erpnext_trial:
        description: Optional bounded full ERPNext historical control trial
        required: true
        default: false
        type: boolean
      shadow_case:
        description: Optional fixed historical shadow control
        required: true
        default: none
        type: choice
        options: [none, or_composition, model_permissions, renderer_boundary]
      shadow_version:
        description: Historical control version
        required: true
        default: original
        type: choice
        options: [original, upstream]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify recorded evidence and run Python regressions
        run: python3 -B scripts/check_release.py
      - name: Check experimental framework identity rules
        run: |
          python3 -B -m unittest discover -s tests -v
          python3 -B -m framework.demo
      - name: Inspect archived reservation through framework adapter
        run: python3 -B -m framework.inspect_recorded > /dev/null

  shadow:
    if: github.event_name == 'workflow_dispatch' && inputs.shadow_case != 'none' && inputs.shadow_case != ''
    uses: ./.github/workflows/shadow-controls.yml
    with:
      case: ${{ inputs.shadow_case }}
      version: ${{ inputs.shadow_version }}
    permissions:
      contents: read

  erpnext:
    if: github.event_name == 'workflow_dispatch' && inputs.erpnext_trial == true
    uses: ./.github/workflows/erpnext-shadow.yml
    permissions:
      contents: read
