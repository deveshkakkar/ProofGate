name: Offline release checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify recorded evidence and run Python regressions
        run: python3 -B scripts/check_release.py
      - name: Check experimental framework identity rules
        run: |
          python3 -B -m unittest discover -s tests -v
          python3 -B -m framework.demo
