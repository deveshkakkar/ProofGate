name: Fixed ERPNext full-application shadow trial

on:
  workflow_call:

permissions:
  contents: read

jobs:
  erpnext:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out selected evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run fixed bounded trial on the disposable runner
        run: python3 -B -m benchmarks.erpnext.app_trial --work "$RUNNER_TEMP/erpnext-shadow"
      - name: Retain bounded diagnostic records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: erpnext-shadow-results
          path: ${{ runner.temp }}/erpnext-shadow/results/
          if-no-files-found: error
          retention-days: 7
